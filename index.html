<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Капиталист — Монополия онлайн</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- Lobby -->
  <div class="lobby" id="lobby">
    <div class="lobby__shell">
      <div class="lobby__card">
        <div class="lobby__header">
          <span class="lobby__icon">💼</span>
          <h1>КАПИТАЛИСТ</h1>
          <p>Корпоративная монополия · до 5 игроков</p>
          <div class="online-badge">
            🟢 Онлайн: <strong id="online-count">0</strong>
          </div>
        </div>

        <div class="lobby__error" id="lobby-error" hidden></div>

        <div id="lobby-menu">
          <label class="lobby__field">
            <span>Ваше имя</span>
            <input type="text" id="player-name" maxlength="20" placeholder="Игрок" value="">
          </label>

          <label class="lobby__field">
            <span>Игроков за столом</span>
            <select id="max-players">
              <option value="1">1 игрок (+ боты)</option>
              <option value="2">2 игрока</option>
              <option value="3">3 игрока</option>
              <option value="4" selected>4 игрока</option>
              <option value="5">5 игроков</option>
            </select>
          </label>

          <button class="btn btn--roll lobby__btn" id="btn-create">🏠 Создать стол</button>
          <a class="btn btn--pass lobby__btn" href="/editor.html">🛠️ Конструктор доски</a>

          <div class="lobby__divider">Столы онлайн</div>
          <div class="rooms-list" id="rooms-list">
            <p class="rooms-empty">Пока нет столов — создайте первый!</p>
          </div>
        </div>

        <div id="lobby-room" hidden>
          <div class="lobby__room-title"><strong id="room-name">Стол</strong></div>
          <p class="lobby__room-count">Игроков: <span id="room-count">0/4</span></p>
          <div class="lobby__players" id="room-players"></div>
          <p class="lobby__hint" id="host-hint" hidden>Ожидайте, пока хост начнёт игру</p>
          <button class="btn btn--roll lobby__btn" id="btn-start">🎲 Начать игру</button>
          <button class="btn btn--pass lobby__btn" id="btn-leave">← Выйти</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Game -->
  <div class="game-shell" id="game-layout" hidden>
    <div class="game-stage" id="game-stage">
      <main class="game-main">
        <div class="board" id="board">
          <div class="board__center" id="board-center">
            <div class="hub">
              <div class="hub__main">
                <div class="hub__turn" id="hub-turn">ХОД ИГРОКА</div>

                <!-- Стол для кубиков без рамки-окна -->
                <div class="table-toss" id="dice-stage">
                  <div class="die-throw" id="die1-throw">
                    <div class="die-wrap">
                      <div class="die-cube" id="die1" aria-label="Кубик 1"></div>
                    </div>
                  </div>
                  <div class="die-throw" id="die2-throw">
                    <div class="die-wrap">
                      <div class="die-cube" id="die2" aria-label="Кубик 2"></div>
                    </div>
                  </div>
                  <div class="table-toss__sum" id="die-sum-wrap"><span id="die-sum">0</span></div>
                </div>

                <div class="hub__player" id="hub-player">
                  <div class="hub__player-name" id="hub-name">—</div>
                  <div class="hub__stats">
                    <div class="hub__stat">
                      <span>Наличные</span>
                      <strong id="hub-cash">$0</strong>
                    </div>
                    <div class="hub__stat">
                      <span>Капитал</span>
                      <strong id="hub-capital">$0</strong>
                    </div>
                    <div class="hub__stat">
                      <span>Компании</span>
                      <strong id="hub-companies">0</strong>
                    </div>
                  </div>
                </div>

                <div class="hub__credit">
                  <span>Кредитная линия: 0</span>
                  <button type="button" class="hub__credit-btn" id="new-game">✕ ВЫЙТИ</button>
                </div>

                <div class="hub__choice" id="choice-panel" hidden></div>
                <div class="hub__actions" id="action-area"></div>
              </div>

              <aside class="hub__chat">
                <div class="hub__chat-title">Чат</div>
                <div class="hub__log" id="game-log"></div>
                <div class="hub__chat-input">
                  <span>😊</span>
                  <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="120" />
                  <button type="button" id="chat-send" title="Отправить">➤</button>
                </div>
              </aside>
            </div>
          </div>
        </div>
      </main>

      <aside class="players-rail" id="players-panel"></aside>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
