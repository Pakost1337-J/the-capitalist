<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Капиталист — Монополия онлайн</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout-tweak.css">
  <script src="/socket.io/socket.io.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Lobby -->
  <div class="lobby" id="lobby">
    <div class="lobby__shell">
      <div class="lobby__card">
        <div class="lobby__header">
          <span class="lobby__icon">💼</span>
          <h1>КАПИТАЛИСТ</h1>
          <p>Корпоративная монополия · до 5 игроков</p>
          <div class="online-badge">
            🟢 Онлайн: <strong id="online-count">0</strong>
          </div>
        </div>

        <div class="lobby__error" id="lobby-error" hidden></div>

        <div id="lobby-menu">
          <label class="lobby__field">
            <span>Ваше имя</span>
            <input type="text" id="player-name" maxlength="20" placeholder="Игрок" value="">
          </label>

          <label class="lobby__field">
            <span>Игроков за столом</span>
            <select id="max-players">
              <option value="1">1 игрок (+ боты)</option>
              <option value="2">2 игрока</option>
              <option value="3">3 игрока</option>
              <option value="4" selected>4 игрока</option>
              <option value="5">5 игроков</option>
            </select>
          </label>

          <button class="btn btn--club lobby__btn" id="btn-create">Создать стол</button>
          <a class="btn btn--club-muted lobby__btn" href="/editor.html">Цвета закраса</a>

          <div class="lobby__divider">Столы онлайн</div>
          <div class="rooms-list" id="rooms-list">
            <p class="rooms-empty">Пока нет столов — создайте первый!</p>
          </div>
        </div>

        <div id="lobby-room" hidden>
          <div class="lobby__room-title"><strong id="room-name">Стол</strong></div>
          <p class="lobby__room-count">Игроков: <span id="room-count">0/4</span></p>
          <div class="lobby__players" id="room-players"></div>
          <p class="lobby__hint" id="host-hint" hidden>Ожидайте, пока хост начнёт игру</p>
          <button class="btn btn--club lobby__btn" id="btn-start">Начать игру</button>
          <button class="btn btn--club-muted lobby__btn" id="btn-leave">Выйти</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Game -->
  <div class="game-shell" id="game-layout" hidden>
    <div class="game-stage" id="game-stage">
      <main class="game-main">
        <div class="board" id="board">
          <div class="board__center" id="board-center">
            <div class="hub">
              <div class="hub__main">
                <div class="hub__arena">
                  <div class="own-toast" id="own-toast" hidden></div>
                  <div class="hub__dice-row">
                    <div class="table-toss table-toss--webgl" id="dice-stage"></div>
                  </div>

                  <div class="hub__choice" id="choice-panel" hidden></div>
                  <div class="hub__actions" id="action-area"></div>
                </div>
              </div>

              <aside class="hub__chat">
                <div class="hub__chat-messages" id="game-log"></div>
                <div class="hub__chat-input">
                  <input type="text" id="chat-input" placeholder="Напишите сообщение" maxlength="120" />
                  <button type="button" id="chat-send" title="Отправить" aria-label="Отправить">
                    <svg class="hub__chat-send-icon" viewBox="0 0 24 24" aria-hidden="true">
                      <path fill="currentColor" d="M3.2 11.05 20.05 3.4a.9.9 0 0 1 1.2 1.05l-3.7 15.2a.9.9 0 0 1-1.45.5l-4.55-3.55-2.7 2.35a.7.7 0 0 1-1.15-.45v-3.7L3.15 12.3a.9.9 0 0 1 .05-1.25Zm8.35 3.05 6.85-7.55-5.2 9.55v-1.35l-1.65-.65Z"/>
                    </svg>
                  </button>
                </div>
              </aside>

            </div>
          </div>
        </div>
      </main>

      <aside class="players-rail" id="players-panel"></aside>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
