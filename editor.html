<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор доски — Капиталист</title>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body class="constructor">
  <header class="ctor-bar">
    <div class="ctor-bar__left">
      <a href="/" class="ctor-link">← В игру</a>
      <h1>🛠️ Конструктор доски</h1>
    </div>
    <p class="ctor-hint">Кликните по клетке, чтобы изменить название и иконку</p>
    <div class="ctor-bar__right">
      <span class="ctor-status" id="status">Загрузка…</span>
      <button class="btn btn--pass" id="btn-reset">Сброс</button>
      <button class="btn btn--roll" id="btn-save">💾 Сохранить</button>
    </div>
  </header>

  <div class="ctor-layout">
    <main class="ctor-board-wrap">
      <div class="board ctor-board" id="board">
        <div class="board__center ctor-center">
          <div class="board__logo">
            <span class="board__logo-icon">💰</span>
            <h1>КАПИТАЛИСТ</h1>
            <p>Нажмите на клетку</p>
          </div>
          <div class="ctor-players" id="players-strip"></div>
        </div>
      </div>
    </main>

    <aside class="ctor-panel" id="panel">
      <div class="ctor-panel__empty" id="panel-empty">
        <div class="ctor-panel__empty-icon">👆</div>
        <p>Выберите клетку на доске<br>или фишку игрока внизу</p>
      </div>

      <div class="ctor-panel__form" id="panel-form" hidden>
        <div class="ctor-panel__preview" id="preview">🍋</div>
        <div class="ctor-panel__id" id="edit-label">Клетка #1</div>

        <label class="ctor-field">
          <span>Название</span>
          <input type="text" id="field-name" maxlength="32" placeholder="Название" />
        </label>

        <label class="ctor-field">
          <span>Иконка — эмодзи или файл (kiosk.png)</span>
          <input type="text" id="field-icon" maxlength="120" placeholder="🍋 или cafe.png" />
        </label>

        <div class="ctor-field">
          <span>Быстрые эмодзи</span>
          <div class="ctor-emojis" id="emoji-picker"></div>
        </div>

        <p class="ctor-tip">
          Свои картинки: положите файл в <code>assets/icons/</code>
          и впишите имя, например <code>bank.png</code>
        </p>

        <button class="btn btn--end ctor-apply" id="btn-apply" type="button">Применить к клетке</button>
      </div>
    </aside>
  </div>

  <script type="module" src="js/editor-board.js"></script>
</body>
</html>
